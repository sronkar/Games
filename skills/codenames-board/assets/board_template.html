<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* One deliberate look: a card table. Single theme, every color set explicitly. */
  :root {
    color-scheme: dark;
    --table: #13201e;
    --table-2: #1b2b28;
    --line: #2d4440;
    --chalk: #ece5d3;
    --chalk-dim: #9fb0a9;
    --card: #e6d9bb;
    --card-edge: #cbb98f;
    --ink: #2a2219;
    --red: #c4402c;
    --red-on: #fff1e8;
    --blue: #2c5d9b;
    --blue-on: #eef4ff;
    --neutral: #d9bf7c;
    --neutral-on: #3a2e14;
    --assassin: #0d0d0f;
    --assassin-on: #e8534a;
    --focus: #f2c14e;
    --word: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(120% 90% at 50% 0%, var(--table-2), var(--table) 70%);
    background-color: var(--table);
    color: var(--chalk);
    font-family: var(--mono);
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    box-sizing: border-box;
    max-width: 760px;
    margin: 0 auto;
    padding: 12px 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Header */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--chalk-dim); }
  .eyebrow b { color: var(--chalk); font-weight: 600; }
  .mode-badge {
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600;
    padding: 4px 8px; border-radius: 3px; border: 1px solid var(--line); color: var(--chalk);
  }
  .mode-spymaster .mode-badge { border-color: var(--assassin-on); color: var(--assassin-on); }

  .score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
  .team {
    display: flex; align-items: baseline; gap: 8px;
    padding: 8px 12px; border-radius: 6px; font-variant-numeric: tabular-nums;
  }
  .team.red { background: var(--red); color: var(--red-on); }
  .team.blue { background: var(--blue); color: var(--blue-on); justify-content: flex-end; }
  .team .n { font-family: var(--word); font-weight: 700; font-size: 30px; line-height: 1; }
  .team .l { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
  .team.done { outline: 2px solid var(--focus); outline-offset: 2px; }
  .starts { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--chalk-dim); text-align: center; line-height: 1.4; }
  .status { min-height: 1.2em; font-size: 12px; text-align: center; color: var(--focus); letter-spacing: .04em; }

  /* Board */
  .board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(4px, 1.4vw, 10px); }
  .tile {
    position: relative; aspect-ratio: 3 / 2; max-width: 100%;
    border: 0; padding: 0; margin: 0; background: none; cursor: pointer;
    perspective: 700px; font: inherit; color: inherit;
  }
  .tile:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,.7,.3,1); }
  .tile.flipped .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; box-sizing: border-box; border-radius: 6px;
    display: grid; place-items: center; padding: 3px 4px; overflow: hidden;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    box-shadow: 0 1px 0 rgba(0,0,0,.35), 0 3px 8px rgba(0,0,0,.28);
  }
  .back { transform: rotateY(180deg); }

  /* Plain agent card: manila with the printed inner frame */
  .face { background: var(--card); color: var(--ink); }
  .face::before {
    content: ""; position: absolute; inset: 3px; border: 1px solid var(--card-edge); border-radius: 3px; pointer-events: none;
  }
  .word {
    position: relative; font-family: var(--word); font-weight: 700; text-transform: uppercase;
    font-size: clamp(11px, 3.5vw, 22px); line-height: 1; letter-spacing: .02em;
    text-align: center; max-width: 100%; overflow-wrap: normal; word-break: keep-all;
  }

  /* Colored faces (spymaster always, public once marked) */
  [data-role="red"] { --fill: var(--red); --on: var(--red-on); }
  [data-role="blue"] { --fill: var(--blue); --on: var(--blue-on); }
  [data-role="neutral"] { --fill: var(--neutral); --on: var(--neutral-on); }
  [data-role="assassin"] { --fill: var(--assassin); --on: var(--assassin-on); }
  .tile[data-role] .face { background: var(--fill); color: var(--on); }
  .tile[data-role] .face::before { border-color: color-mix(in srgb, var(--on) 30%, transparent); }

  /* Public: a marked word stays readable but steps back */
  .mode-public .tile[data-role] .word { opacity: .72; font-size: .82em; }
  .mode-public .tile[data-role] .face {
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.07) 0 6px, transparent 6px 12px);
  }
  .mode-public .tile[data-role="assassin"] .face { box-shadow: 0 0 0 2px var(--assassin-on), 0 3px 8px rgba(0,0,0,.4); }

  /* Spymaster back face: same color, no word */
  .tile[data-role] .back { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.09) 0 5px, transparent 5px 10px); }
  .tile.flipped .back { filter: saturate(.6) brightness(.78); }
  .role { position: relative; font-size: clamp(7px, 1.9vw, 11px); letter-spacing: .12em; text-transform: uppercase; font-weight: 600; opacity: .9; text-align: center; }

  /* Controls */
  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font: 600 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
    padding: 11px 14px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--table-2); color: var(--chalk); cursor: pointer;
  }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .btn.armed { border-color: var(--assassin-on); color: var(--assassin-on); }
  .hint { font-size: 11px; color: var(--chalk-dim); text-align: center; line-height: 1.5; max-width: 60ch; margin: 0 auto; }

  /* Picker sheet (public) */
  .scrim { position: fixed; inset: 0; background: rgba(5,10,9,.6); z-index: 10; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    background: var(--table-2); border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 12px;
    max-width: 560px; margin: 0 auto; box-sizing: border-box;
  }
  .sheet h2 { margin: 0; font-family: var(--word); font-weight: 700; font-size: 28px; letter-spacing: .03em; text-transform: uppercase; text-align: center; }
  .sheet .q { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--chalk-dim); text-align: center; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .choice {
    font: 600 13px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase;
    padding: 16px 10px; border-radius: 8px; border: 0; cursor: pointer;
    background: var(--fill); color: var(--on);
  }
  .choice:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .choice[data-role="assassin"] { box-shadow: inset 0 0 0 1px var(--assassin-on); }
  .choice[aria-pressed="true"] { outline: 3px solid var(--chalk); outline-offset: 2px; }
  .sheet-row { display: flex; gap: 8px; }
  .sheet-row .btn { flex: 1; }

  /* Game-over card */
  .dialog {
    position: fixed; z-index: 12; left: 16px; right: 16px; top: 50%; transform: translateY(-50%);
    max-width: 420px; margin: 0 auto; box-sizing: border-box;
    background: var(--assassin); color: var(--chalk); border: 1px solid var(--assassin-on); border-radius: 12px;
    padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; text-align: center;
  }
  .dialog.win-red { border-color: var(--red); }
  .dialog.win-blue { border-color: var(--blue); }
  .dialog h2 { margin: 0; font-family: var(--word); font-size: 34px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; text-wrap: balance; }
  .dialog p { margin: 0; font-size: 12px; line-height: 1.6; color: var(--chalk-dim); }

  @media (prefers-reduced-motion: reduce) { .inner { transition: none; } }
  @media (min-width: 700px) { .word { font-size: 22px; } }
</style>
<!--BODY-->
<div class="wrap" id="app">
  <div class="top">
    <div class="eyebrow">Codenames · <b id="modeName"></b></div>
    <div class="mode-badge" id="modeBadge"></div>
  </div>

  <div class="score">
    <div class="team red" id="teamRed"><span class="n" id="redLeft">0</span><span class="l">red left</span></div>
    <div class="starts" id="starts"></div>
    <div class="team blue" id="teamBlue"><span class="l">blue left</span><span class="n" id="blueLeft">0</span></div>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>

  <div class="board" id="board" role="grid" aria-label="Codenames board"></div>

  <div class="controls">
    <button class="btn" id="undoBtn" type="button">Undo</button>
    <button class="btn" id="resetBtn" type="button">Clear board</button>
  </div>
  <p class="hint" id="hint"></p>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetWord" hidden>
  <div class="q">Who is this?</div>
  <h2 id="sheetWord"></h2>
  <div class="choices">
    <button class="choice" type="button" data-role="red" data-pick="red">Red agent</button>
    <button class="choice" type="button" data-role="blue" data-pick="blue">Blue agent</button>
    <button class="choice" type="button" data-role="neutral" data-pick="neutral">Bystander</button>
    <button class="choice" type="button" data-role="assassin" data-pick="assassin">Assassin</button>
  </div>
  <div class="sheet-row">
    <button class="btn" type="button" id="unmarkBtn">Unmark</button>
    <button class="btn" type="button" id="cancelBtn">Cancel</button>
  </div>
</div>

<div class="dialog" id="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle" hidden>
  <h2 id="dialogTitle"></h2>
  <p id="dialogText"></p>
  <div class="sheet-row">
    <button class="btn" type="button" id="dialogUndo">Undo last</button>
    <button class="btn" type="button" id="dialogClose">Back to board</button>
  </div>
</div>

<script>
(function () {
  "use strict";
  var DATA = /*__DATA__*/null;
  if (!DATA) {
    // Template opened directly: show a sample so the page is never empty.
    DATA = {
      mode: "spymaster", id: "sample", starting: "red", totals: { red: 9, blue: 8 },
      words: ["AGENT","BERLIN","CASINO","DIAMOND","EAGLE","FALL","GLOVE","HOOK","ICE CREAM","JUPITER",
              "KETCHUP","LASER","MOSCOW","NINJA","OCTOPUS","PIANO","QUEEN","ROBOT","SATURN","TORCH",
              "UNICORN","VAN","WHALE","YARD","ZIPPER"],
      key: ["red","blue","neutral","red","blue","neutral","red","assassin","blue","red",
            "neutral","blue","red","neutral","blue","red","neutral","blue","red","neutral",
            "blue","red","neutral","blue","red"]
    };
  }

  var MODE = DATA.mode === "spymaster" ? "spymaster" : "public";
  var N = DATA.words.length;
  var ROLE_NAME = { red: "Red agent", blue: "Blue agent", neutral: "Bystander", assassin: "Assassin" };
  var TEAM = { red: "Red", blue: "Blue" };
  var storeKey = "codenames:" + MODE + ":" + DATA.id;

  var $ = function (id) { return document.getElementById(id); };
  var app = $("app");
  document.body.classList.add("mode-" + MODE);

  // ---- state ----
  var state = load() || fresh();
  function fresh() {
    return MODE === "public"
      ? { marks: new Array(N).fill(null), history: [] }
      : { flipped: new Array(N).fill(false), history: [] };
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(storeKey) || "null");
      if (s && Array.isArray(s.history) && ((MODE === "public" && s.marks && s.marks.length === N) ||
          (MODE === "spymaster" && s.flipped && s.flipped.length === N))) return s;
    } catch (e) {}
    return null;
  }
  function save() { try { localStorage.setItem(storeKey, JSON.stringify(state)); } catch (e) {} }

  function roleAt(i) { return MODE === "public" ? state.marks[i] : (state.flipped[i] ? DATA.key[i] : null); }
  function counts() {
    var c = { red: 0, blue: 0, neutral: 0, assassin: 0 };
    for (var i = 0; i < N; i++) { var r = roleAt(i); if (r) c[r]++; }
    return c;
  }

  // ---- header ----
  $("modeName").textContent = MODE === "public" ? "Field board" : "Spymaster key";
  $("modeBadge").textContent = MODE === "public" ? "Players" : "Spymasters only";
  $("starts").innerHTML = TEAM[DATA.starting] ? TEAM[DATA.starting] + "<br>starts" : "";
  $("hint").textContent = MODE === "public"
    ? "Tap a word after a guess and pick what the spymaster says it is. Tap a marked word to change or unmark it."
    : "Colors show every agent. Tap a word when it gets guessed to flip it face down. Tap again to flip it back.";

  // ---- board ----
  var board = $("board");
  var tiles = [];
  DATA.words.forEach(function (w, i) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "tile";
    b.dataset.i = i;
    b.setAttribute("role", "gridcell");
    var inner = document.createElement("span"); inner.className = "inner";
    var front = document.createElement("span"); front.className = "face front";
    var word = document.createElement("span"); word.className = "word"; word.textContent = w;
    front.appendChild(word); inner.appendChild(front);
    if (MODE === "spymaster") {
      b.dataset.role = DATA.key[i];
      var back = document.createElement("span"); back.className = "face back";
      var role = document.createElement("span"); role.className = "role"; role.textContent = ROLE_NAME[DATA.key[i]];
      back.appendChild(role); inner.appendChild(back);
    }
    b.appendChild(inner);
    b.addEventListener("click", function () { onTile(i); });
    board.appendChild(b);
    tiles.push(b);
  });

  function render() {
    tiles.forEach(function (t, i) {
      var w = DATA.words[i];
      if (MODE === "public") {
        var m = state.marks[i];
        if (m) t.dataset.role = m; else delete t.dataset.role;
        t.setAttribute("aria-label", w + (m ? ", " + ROLE_NAME[m] : ", not guessed"));
      } else {
        t.classList.toggle("flipped", !!state.flipped[i]);
        t.setAttribute("aria-label", w + ", " + ROLE_NAME[DATA.key[i]] + (state.flipped[i] ? ", guessed" : ""));
      }
    });
    var c = counts();
    var redLeft = Math.max(0, DATA.totals.red - c.red), blueLeft = Math.max(0, DATA.totals.blue - c.blue);
    $("redLeft").textContent = redLeft;
    $("blueLeft").textContent = blueLeft;
    $("teamRed").classList.toggle("done", redLeft === 0);
    $("teamBlue").classList.toggle("done", blueLeft === 0);
    var status = "";
    if (c.assassin > 0) status = "Game over. The assassin was contacted.";
    else if (redLeft === 0) status = "Red found every agent.";
    else if (blueLeft === 0) status = "Blue found every agent.";
    $("status").textContent = status;
    $("undoBtn").disabled = state.history.length === 0;
    fitWords();
  }

  // Shrink long words until they fit their card.
  function fitWords() {
    tiles.forEach(function (t) {
      var el = t.querySelector(".word"), face = t.querySelector(".front");
      el.style.fontSize = "";
      var size = parseFloat(getComputedStyle(el).fontSize);
      var maxW = face.clientWidth - 10, maxH = face.clientHeight - 6;
      while (size > 7 && (el.scrollWidth > maxW || el.offsetHeight > maxH)) {
        size -= 0.5;
        el.style.fontSize = size + "px";
      }
    });
  }
  var fitTimer;
  window.addEventListener("resize", function () { clearTimeout(fitTimer); fitTimer = setTimeout(fitWords, 80); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitWords);

  // ---- interactions ----
  var current = -1, lastFocus = null;
  function onTile(i) {
    keepAwake();
    if (MODE === "spymaster") {
      var was = state.flipped[i];
      state.flipped[i] = !was;
      state.history.push({ i: i, prev: was });
      save(); render();
      if (!was) announce(DATA.key[i]);
      return;
    }
    openSheet(i);
  }

  function openSheet(i) {
    current = i; lastFocus = tiles[i];
    $("sheetWord").textContent = DATA.words[i];
    var m = state.marks[i];
    Array.prototype.forEach.call(document.querySelectorAll(".choice"), function (c) {
      c.setAttribute("aria-pressed", c.dataset.pick === m ? "true" : "false");
    });
    $("unmarkBtn").disabled = !m;
    $("scrim").hidden = false; $("sheet").hidden = false;
    var first = document.querySelector('.choice[data-pick="' + (m || "red") + '"]');
    if (first) first.focus();
  }
  function closeSheet() {
    $("scrim").hidden = true; $("sheet").hidden = true; current = -1;
    if (lastFocus) lastFocus.focus();
  }
  function setMark(value) {
    if (current < 0) return;
    var i = current, prev = state.marks[i];
    closeSheet();
    if (prev === value) return;
    state.marks[i] = value;
    state.history.push({ i: i, prev: prev });
    save(); render();
    if (value) announce(value);
  }
  Array.prototype.forEach.call(document.querySelectorAll(".choice"), function (c) {
    c.addEventListener("click", function () { setMark(c.dataset.pick); });
  });
  $("unmarkBtn").addEventListener("click", function () { setMark(null); });
  $("cancelBtn").addEventListener("click", closeSheet);
  $("scrim").addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (!$("sheet").hidden) closeSheet();
    if (!$("dialog").hidden) closeDialog();
  });

  // Game-over card appears once, at the moment it happens.
  function announce(role) {
    var c = counts();
    var redLeft = DATA.totals.red - c.red, blueLeft = DATA.totals.blue - c.blue;
    var d = $("dialog");
    d.className = "dialog";
    if (role === "assassin") {
      $("dialogTitle").textContent = "Assassin";
      $("dialogText").textContent = "“" + DATA.words[lastIndex()] + "” was the assassin. The team that guessed it loses.";
    } else if ((role === "red" && redLeft === 0) || (role === "blue" && blueLeft === 0)) {
      d.classList.add("win-" + role);
      $("dialogTitle").textContent = TEAM[role] + " wins";
      $("dialogText").textContent = "Every " + TEAM[role].toLowerCase() + " agent has been contacted.";
    } else {
      return;
    }
    d.hidden = false; $("scrim").hidden = false;
    $("dialogClose").focus();
  }
  function lastIndex() { return state.history.length ? state.history[state.history.length - 1].i : 0; }
  function closeDialog() { $("dialog").hidden = true; $("scrim").hidden = true; }
  $("dialogClose").addEventListener("click", closeDialog);
  $("dialogUndo").addEventListener("click", function () { closeDialog(); undo(); });

  function undo() {
    var h = state.history.pop();
    if (!h) return;
    if (MODE === "public") state.marks[h.i] = h.prev; else state.flipped[h.i] = h.prev;
    save(); render();
  }
  $("undoBtn").addEventListener("click", undo);

  // Clear needs a second tap within 3 seconds (the viewer blocks confirm()).
  var armTimer;
  $("resetBtn").addEventListener("click", function () {
    var b = $("resetBtn");
    if (!b.classList.contains("armed")) {
      b.classList.add("armed"); b.textContent = "Tap again to clear";
      armTimer = setTimeout(function () { b.classList.remove("armed"); b.textContent = "Clear board"; }, 3000);
      return;
    }
    clearTimeout(armTimer);
    b.classList.remove("armed"); b.textContent = "Clear board";
    state = fresh(); save(); render();
  });

  // Keep the phone screen on while the board is in use, where the browser allows it.
  var lock = null;
  function keepAwake() {
    if (lock || !("wakeLock" in navigator)) return;
    navigator.wakeLock.request("screen").then(function (l) {
      lock = l; l.addEventListener("release", function () { lock = null; });
    }).catch(function () {});
  }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && state.history.length) keepAwake(); });

  render();
})();
</script>
